name: Store Intelligence CI

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API and test dependencies
        run: |
          python -m pip install -r api/requirements.txt
          python -m pip install -r api/requirements-dev.txt
          python -m pip install -r pipeline/requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest -q pipeline/tests api/tests
