# All services share the same SQLite database volume.
volumes:
  db_data:

services:
  pipeline:
    build:
      context: ./pipeline
    container_name: si_pipeline
    volumes:
      - db_data:/data
      - ./video:/video:ro
    environment:
      EVENTS_DB: /data/events.db
    command: ["python", "detector.py", "--source", "/video/input.mp4"]
    restart: "no"

  api:
    build:
      context: ./api
    container_name: si_api
    volumes:
      - db_data:/data
    environment:
      EVENTS_DB: /data/events.db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: si_dashboard
    environment:
      API_BASE: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
